<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-container">

    <!-- LOGO -->
    <div class="logo-container">
        <img src="/images/mi_logo.png" alt="Logo MiTFG">
    </div>

    <h2>Iniciar Sesión</h2>

    <div th:if="${param.error}" class="error-message">
        Usuario o contraseña incorrectos
    </div>

    <div th:if="${param.logout}" class="success-message">
        Has cerrado sesión correctamente
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
        </div>

        <button type="submit" class="login-btn">Entrar</button>
    </form>

    <!-- DESCARGA APK -->
    <div class="apk-download">
        <a th:href="@{/downloads/tfgapp.apk}" href="/downloads/tfgapp.apk" download="TFGApp.apk" class="apk-link">
            <svg class="apk-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="currentColor" d="M20,12l-1.41,-1.41L13,16.17V4h-2v12.17l-5.58,-5.59L4,12l8,8 8,-8z"/>
            </svg>
            Descargar app para Android
        </a>
        <p class="apk-note">Archivo APK · Android 7.0 o superior</p>
    </div>
</div>

</body>
</html>
