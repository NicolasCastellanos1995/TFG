<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar usuario' : 'Crear usuario'">Formulario Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/user-form.css}">
</head>
<body>

<div class="form-container">
    <div class="card user-form-card p-4">

        <h3 class="text-center mb-4"
            th:text="${modoEdicion} ? 'Editar usuario' : 'Crear nuevo usuario'">
            Crear nuevo usuario
        </h3>

        <div th:with="formAction=${modoEdicion} ? '/admin/users/update' : '/admin/users/save'">
            <form th:action="${formAction}" th:object="${user}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="username" class="form-label">Nombre de usuario</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" required>

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required>

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Rol</label>
                    <select id="role" th:field="*{role}" class="form-select" required>
                        <option value="">Selecciona un rol</option>
                        <option value="admin">Admin</option>
                        <option value="operario">Operario</option>
                        <option value="supervisor">Supervisor</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           class="form-control"
                           th:required="${!modoEdicion}">

                    <div class="form-text" th:if="${modoEdicion}">
                        Déjala vacía si no quieres cambiar la contraseña.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="active" class="form-label">Estado</label>
                    <select id="active" th:field="*{active}" class="form-select">
                        <option th:value="true">Activo</option>
                        <option th:value="false">Inactivo</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between gap-3">
                    <a th:href="@{/admin}" class="btn btn-outline-secondary w-50">Cancelar</a>
                    <button type="submit"
                            class="btn btn-primary w-50"
                            th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'">
                        Guardar
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>

</body>
</html>
