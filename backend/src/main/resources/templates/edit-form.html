<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar usuario' : 'Crear usuario'">Formulario Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/edit-form.css}">
</head>

<body>

<div class="form-container">
    <div class="card form-card p-4">

        <h3 class="text-center mb-4"
            th:text="${modoEdicion} ? 'Editar usuario' : 'Crear nuevo usuario'">
        </h3>

        <form th:action="${modoEdicion} ? @{/admin/users/update} : @{/admin/users/save}"
              th:object="${user}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <!-- USERNAME -->
            <div class="mb-3">
                <label class="form-label">Nombre de usuario</label>
                <input type="text" th:field="*{username}" class="form-control" required>
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>

            <!-- ROLE -->
            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select th:field="*{role}" class="form-select" required>
                    <option value="">Selecciona un rol</option>
                    <option value="admin">Admin</option>
                    <option value="operario">Operario</option>
                    <option value="supervisor">Supervisor</option>
                </select>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password"
                       th:field="*{password}"
                       class="form-control"
                       th:required="${!modoEdicion}">

                <small class="form-text" th:if="${modoEdicion}">
                    Déjala vacía si no quieres cambiarla
                </small>
            </div>

            <!-- ACTIVE -->
            <div class="mb-4">
                <label class="form-label">Estado</label>
                <select th:field="*{active}" class="form-select">
                    <option th:value="true">Activo</option>
                    <option th:value="false">Inactivo</option>
                </select>
            </div>

            <div class="d-flex gap-3">
                <a th:href="@{/admin}" class="btn btn-outline-secondary w-50">Cancelar</a>

                <button type="submit"
                        class="btn btn-primary w-50"
                        th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'">
                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
