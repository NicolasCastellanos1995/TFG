services:
  postgres:
    image: postgres:16
    profiles: [docker-db]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tfg_db}
      POSTGRES_USER: ${DB_USER:?Falta DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: .
    restart: unless-stopped
    environment:
      DB_JDBC_URL: ${SELECTED_DB_URL:?Ejecuta scripts/start.sh o scripts/start.ps1}
      DB_USERNAME: ${SELECTED_DB_USER:?Falta SELECTED_DB_USER}
      DB_PASSWORD: ${SELECTED_DB_PASSWORD:?Falta SELECTED_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - backend_logs:/app/logs
volumes:
  postgres_data:
  backend_logs:
